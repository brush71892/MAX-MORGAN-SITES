<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAX MORGAN RNG</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #111827;
        --panel: rgba(15, 23, 42, 0.86);
        --panel-border: rgba(148, 163, 184, 0.22);
        --primary: #8b5cf6;
        --primary-2: #a78bfa;
        --accent: #22c55e;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --shadow: rgba(15, 23, 42, 0.65);
        --grass-1: #3d7d3d;
        --grass-2: #2d6c2d;
        --grass-3: #4f9a4f;
        --shop: #d4a373;
        --player: #f8fafc;
        --gold: #fbbf24;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #1e293b 0%, var(--bg-1) 35%, var(--bg-2) 100%);
        color: var(--text);
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 18px;
      }

      .game-shell {
        display: grid;
        grid-template-columns: minmax(0, 1.7fr) minmax(280px, 380px);
        width: min(100%, 1200px);
        gap: 18px;
        align-items: start;
      }

      .arena-wrap {
        position: relative;
        border-radius: 22px;
        overflow: hidden;
        border: 1px solid var(--panel-border);
        background: rgba(15, 23, 42, 0.82);
        box-shadow: 0 28px 70px var(--shadow);
      }

      canvas {
        display: block;
        width: 100%;
        height: min(75vh, 720px);
        background: linear-gradient(180deg, #5fa55d 0%, #4a8d48 100%);
      }

      .hud-overlay {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .topbar {
        position: absolute;
        top: 16px;
        left: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .badge {
        background: rgba(15, 23, 42, 0.6);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.82rem;
        color: var(--text);
        backdrop-filter: blur(6px);
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 18px;
        padding: 16px 18px;
        box-shadow: 0 18px 44px rgba(15, 23, 42, 0.32);
      }

      .panel h2 {
        margin: 0 0 12px;
        font-size: 1rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .statline {
        margin: 8px 0;
        color: var(--text);
      }

      .primary, .secondary {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        font-weight: 700;
        transition: transform 0.16s ease, opacity 0.16s ease;
      }

      .primary:hover, .secondary:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: white;
        padding: 12px 16px;
        width: 100%;
        margin-bottom: 12px;
      }

      .secondary {
        background: rgba(148, 163, 184, 0.12);
        color: var(--text);
        border: 1px solid rgba(148, 163, 184, 0.22);
        padding: 10px 14px;
        width: 100%;
      }

      .roll-output {
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.15);
        border-radius: 12px;
        padding: 10px 12px;
        margin-bottom: 12px;
      }

      .label {
        display: block;
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 6px;
      }

      #lastRoll, #equippedAura {
        font-size: 1rem;
        font-weight: 700;
      }

      .inventory {
        margin-top: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        max-height: 260px;
        overflow: auto;
      }

      .aura-item {
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 10px;
        padding: 8px 10px;
        font-size: 0.9rem;
      }

      .aura-item strong {
        display: block;
        margin-bottom: 2px;
      }

      .aura-item small {
        color: var(--muted);
      }

      .shop-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        background: rgba(148, 163, 184, 0.06);
        padding: 10px 12px;
        margin: 8px 0;
      }

      .shop-item strong {
        display: block;
        margin-bottom: 2px;
      }

      .shop-item small {
        color: var(--muted);
      }

      .shop-item button {
        border: none;
        background: linear-gradient(135deg, #fbbf24, #f59e0b);
        color: #1f2937;
        border-radius: 10px;
        font-weight: 700;
        padding: 8px 10px;
        cursor: pointer;
      }

      .shop-item button:disabled {
        opacity: 0.6;
        cursor: default;
      }

      @media (max-width: 900px) {
        .game-shell {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="arena-wrap">
        <canvas id="gameCanvas" width="900" height="620"></canvas>
        <div class="hud-overlay">
          <div class="topbar">
            <div class="badge">Coins: <span id="coinCount">120</span></div>
            <div class="badge">Luck: <span id="luckValue">+0</span></div>
            <div class="badge">Aura: <span id="topBarAura">None</span></div>
          </div>
        </div>
      </div>

      <aside class="sidebar">
        <div class="panel">
          <h2>Player</h2>
          <p class="statline">Gauntlets: <span id="gauntletName">Worn Gauntlets</span></p>
          <p class="statline">Luck Bonus: <span id="playerLuck">+0</span></p>
          <p class="statline">Coins: <span id="playerCoins">120</span></p>
        </div>

        <div class="panel">
          <h2>Aura Locker</h2>
          <button id="rollBtn" class="primary" type="button">Roll Aura</button>
          <div class="roll-output">
            <span class="label">Last Roll</span>
            <div id="lastRoll">None</div>
          </div>
          <div class="roll-output">
            <span class="label">Equipped</span>
            <div id="equippedAura">None</div>
          </div>
          <button id="equipBestBtn" class="secondary" type="button">Equip Best Owned</button>
          <div id="auraInventory" class="inventory"></div>
        </div>

        <div class="panel">
          <h2>Shop</h2>
          <div id="shopList"></div>
        </div>
      </aside>
    </div>

    <script>
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');

      const coinCountEl = document.getElementById('coinCount');
      const luckValueEl = document.getElementById('luckValue');
      const topBarAuraEl = document.getElementById('topBarAura');
      const gauntletNameEl = document.getElementById('gauntletName');
      const playerLuckEl = document.getElementById('playerLuck');
      const playerCoinsEl = document.getElementById('playerCoins');
      const lastRollEl = document.getElementById('lastRoll');
      const equippedAuraEl = document.getElementById('equippedAura');
      const auraInventoryEl = document.getElementById('auraInventory');
      const shopListEl = document.getElementById('shopList');

      const state = {
        coins: 120,
        gauntletLevel: 0,
        inventory: [],
        equippedAura: null,
        lastRoll: null,
        player: {
          x: 900,
          y: 500,
          radius: 18,
          speed: 220,
        }
      };

      const world = {
        width: 1900,
        height: 1200,
      };

      const shop = {
        x: 1620,
        y: 250,
        width: 150,
        height: 120,
      };

      const gauntletShop = [
        { name: 'Worn Gauntlets', cost: 0, luck: 0 },
        { name: 'Lucky Bracers', cost: 40, luck: 5 },
        { name: 'Hearth Cuffs', cost: 85, luck: 12 },
        { name: 'Silver Wristguards', cost: 180, luck: 24 },
        { name: 'Golden Fists', cost: 360, luck: 40 },
        { name: 'Celestial Gauntlets', cost: 700, luck: 70 },
      ];

      const keys = {};
      const auraCatalog = buildAuraCatalog();

      function buildAuraCatalog() {
        const adjectives = [
          'Verdant', 'Gilded', 'Moonlit', 'Ember', 'Prism', 'Storm', 'Radiant', 'Ancient',
          'Silent', 'Cosmic', 'Iron', 'Woven', 'Solar', 'Frost', 'Aether', 'Velvet',
          'Crimson', 'Azure', 'Moss', 'Dawn', 'Echo', 'Glacier', 'Thorn', 'Obsidian', 'Nova',
          'Amber', 'Royal', 'Jade', 'Twilight', 'Phantom', 'Golden', 'Wild', 'Celestial'
        ];

        const nouns = [
          'Bloom', 'Halo', 'Tide', 'Glyph', 'Thread', 'Sigil', 'Echo', 'Haze', 'Spring',
          'Crown', 'Pulse', 'Shard', 'Fang', 'Wing', 'Flare', 'Rune', 'Dust', 'Mist', 'Latch',
          'Bloom', 'Comet', 'Echo', 'Vow', 'Moonglass', 'Beacon', 'Lotus', 'Vortex', 'Gale',
          'Glass', 'Lantern', 'Forge', 'Cinder', 'Spark', 'Thorn', 'Fable', 'Basilisk', 'Star'
        ];

        const items = [];

        for (let i = 0; i < 150; i += 1) {
          const odds = Math.round(Math.exp(Math.log(2) + (i / 149) * (Math.log(1000000) - Math.log(2))));
          const rarity =
            odds <= 10 ? 'Common' :
            odds <= 100 ? 'Uncommon' :
            odds <= 1000 ? 'Rare' :
            odds <= 10000 ? 'Epic' :
            odds <= 100000 ? 'Legendary' :
            'Mythic';

          const name = `${adjectives[i % adjectives.length]} ${nouns[(i * 7) % nouns.length]}`;
          items.push({
            id: i,
            name,
            odds,
            rarity,
            tier: rarity,
          });
        }

        return items;
      }

      function getLuckBonusFromShop() {
        return gauntletShop.slice(0, state.gauntletLevel + 1).reduce((sum, item) => sum + item.luck, 0);
      }

      function getBestAuraOwned() {
        if (!state.inventory.length) return null;
        return [...state.inventory].sort((a, b) => b.odds - a.odds)[0];
      }

      function equipBestOwned() {
        const best = getBestAuraOwned();
        state.equippedAura = best || null;
        renderHud();
      }

      function renderInventory() {
        const sorted = [...state.inventory].sort((a, b) => b.odds - a.odds);

        if (!sorted.length) {
          auraInventoryEl.innerHTML = '<div class="aura-item"><strong>No auras yet</strong><small>Roll for your first aura.</small></div>';
          return;
        }

        auraInventoryEl.innerHTML = sorted.map((aura) => `
          <div class="aura-item">
            <strong>${aura.name}</strong>
            <small>${aura.rarity} · 1 in ${aura.odds}</small>
          </div>
        `).join('');
      }

      function renderShop() {
        shopListEl.innerHTML = gauntletShop.map((item, index) => {
          const isOwned = index < state.gauntletLevel;
          const isCurrent = index === state.gauntletLevel;
          const affordable = state.coins >= item.cost && !isOwned && !isCurrent;

          let buttonText = 'Buy';
          if (isOwned) buttonText = 'Owned';
          if (isCurrent) buttonText = 'Equipped';
          if (!isOwned && !isCurrent && item.cost === 0) buttonText = 'Free';

          return `
            <div class="shop-item">
              <div>
                <strong>${item.name}</strong>
                <small>+${item.luck} luck</small>
              </div>
              <button data-index="${index}" ${isOwned || isCurrent || !affordable ? 'disabled' : ''}>
                ${isOwned || isCurrent ? buttonText : `Buy ${item.cost}`}
              </button>
            </div>
          `;
        }).join('');

        shopListEl.querySelectorAll('button[data-index]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.dataset.index);
            if (index === state.gauntletLevel + 1) {
              const item = gauntletShop[index];
              if (state.coins >= item.cost) {
                state.coins -= item.cost;
                state.gauntletLevel = index;
                renderHud();
                renderShop();
              }
            }
          });
        });
      }

      function renderHud() {
        const totalLuck = getLuckBonusFromShop();
        const currentAura = state.equippedAura ? state.equippedAura.name : 'None';
        const lastRoll = state.lastRoll ? state.lastRoll.name : 'None';

        coinCountEl.textContent = state.coins;
        luckValueEl.textContent = `+${totalLuck}`;
        topBarAuraEl.textContent = currentAura;
        gauntletNameEl.textContent = gauntletShop[state.gauntletLevel].name;
        playerLuckEl.textContent = `+${totalLuck}`;
        playerCoinsEl.textContent = state.coins;
        lastRollEl.textContent = lastRoll;
        equippedAuraEl.textContent = currentAura;
      }

      function weightedAuraRoll() {
        const totalLuck = getLuckBonusFromShop();
        const weighted = auraCatalog.map((aura) => {
          const luckMultiplier = 1 + totalLuck / 40;
          const weight = (1 / aura.odds) * luckMultiplier;
          return { ...aura, weight };
        });

        const totalWeight = weighted.reduce((sum, item) => sum + item.weight, 0);
        let cursor = Math.random() * totalWeight;

        for (const aura of weighted) {
          cursor -= aura.weight;
          if (cursor <= 0) {
            return aura;
          }
        }

        return weighted[weighted.length - 1];
      }

      function rollAura() {
        const reward = weightedAuraRoll();
        state.lastRoll = reward;
        state.inventory.push(reward);
        state.coins += 10;
        equipBestOwned();
        renderInventory();
        renderHud();
        renderShop();
      }

      function updatePlayer(dt) {
        let dirX = 0;
        let dirY = 0;

        if (keys['w'] || keys['arrowup']) dirY -= 1;
        if (keys['s'] || keys['arrowdown']) dirY += 1;
        if (keys['a'] || keys['arrowleft']) dirX -= 1;
        if (keys['d'] || keys['arrowright']) dirX += 1;

        if (dirX !== 0 || dirY !== 0) {
          const length = Math.hypot(dirX, dirY) || 1;
          dirX /= length;
          dirY /= length;

          state.player.x += dirX * state.player.speed * dt;
          state.player.y += dirY * state.player.speed * dt;
        }

        state.player.x = Math.max(state.player.radius, Math.min(world.width - state.player.radius, state.player.x));
        state.player.y = Math.max(state.player.radius, Math.min(world.height - state.player.radius, state.player.y));
      }

      function drawGrass() {
        const tile = 48;
        for (let x = 0; x < world.width; x += tile) {
          for (let y = 0; y < world.height; y += tile) {
            const hue = ((x / tile) + (y / tile)) % 2 === 0 ? '#4d924d' : '#3f7d3f';
            ctx.fillStyle = hue;
            ctx.fillRect(x, y, tile, tile);
          }
        }
      }

      function drawShop() {
        const x = shop.x;
        const y = shop.y;
        const w = shop.width;
        const h = shop.height;

        ctx.fillStyle = '#c084fc';
        ctx.fillRect(x - w / 2, y - h / 2, w, h);
        ctx.fillStyle = '#f5d0fe';
        ctx.fillRect(x - 18, y - 20, 36, 28);
        ctx.fillStyle = '#78350f';
        ctx.fillRect(x - 52, y + 18, 104, 16);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 18px Arial';
        ctx.fillText('SHOP', x - 30, y - 34);
      }

      function drawPlayer() {
        const x = state.player.x;
        const y = state.player.y;

        ctx.fillStyle = '#f8fafc';
        ctx.beginPath();
        ctx.arc(x, y, state.player.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#1f2937';
        ctx.fillRect(x - 6, y - 10, 12, 8);
        ctx.fillStyle = '#e2e8f0';
        ctx.fillRect(x - 4, y + 4, 8, 16);
      }

      function drawMap() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cameraX = state.player.x - canvas.width / 2;
        const cameraY = state.player.y - canvas.height / 2;

        ctx.save();
        ctx.translate(-cameraX, -cameraY);

        drawGrass();
        drawShop();
        drawPlayer();

        ctx.restore();
      }

      function loop(ts) {
        if (!loop.last) loop.last = ts;
        const dt = Math.min((ts - loop.last) / 1000, 0.033);
        loop.last = ts;

        updatePlayer(dt);
        drawMap();
        requestAnimationFrame(loop);
      }

      window.addEventListener('keydown', (event) => {
        const key = event.key.toLowerCase();
        if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(key)) {
          event.preventDefault();
        }
        keys[key] = true;
      });

      window.addEventListener('keyup', (event) => {
        keys[event.key.toLowerCase()] = false;
      });

      document.getElementById('rollBtn').addEventListener('click', rollAura);
      document.getElementById('equipBestBtn').addEventListener('click', () => {
        equipBestOwned();
      });

      state.equippedAura = null;
      renderInventory();
      renderShop();
      renderHud();
      requestAnimationFrame(loop);
    </script>
  </body>
</html>
