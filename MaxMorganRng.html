<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAX MORGAN RNG - Sol's Expanded Edition</title>
    <style>
      :root {
        --bg: #05070e;
        --panel: rgba(12, 19, 36, 0.94);
        --panel-border: rgba(148, 163, 184, 0.25);
        --primary: #8b5cf6;
        --primary-glow: #a78bfa;
        --accent: #22c55e;
        --gold: #fbbf24;
        --text: #f8fafc;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        user-select: none;
      }

      #gameCanvas {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        display: block;
        z-index: 1;
      }

      .hud-topbar {
        position: fixed;
        top: 16px;
        left: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        justify-content: space-between;
        align-items: center;
        pointer-events: none;
      }

      .hud-group {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        pointer-events: auto;
      }

      .hud-badge {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 0.9rem;
        font-weight: 700;
        backdrop-filter: blur(12px);
        box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .hud-btn {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 0.9rem;
        font-weight: 700;
        cursor: pointer;
        backdrop-filter: blur(12px);
        transition: all 0.2s ease;
        box-shadow: 0 8px 24px rgba(0,0,0,0.3);
      }

      .hud-btn:hover {
        background: rgba(139, 92, 246, 0.35);
        border-color: var(--primary-glow);
        transform: translateY(-2px);
      }

      .hud-roll-bar {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 12px;
        align-items: center;
        background: var(--panel);
        border: 1px solid var(--panel-border);
        padding: 12px 24px;
        border-radius: 20px;
        backdrop-filter: blur(16px);
        box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      }

      .btn-roll {
        background: linear-gradient(135deg, var(--primary), #6366f1);
        color: #fff;
        border: none;
        border-radius: 14px;
        padding: 14px 28px;
        font-size: 1.1rem;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(139, 92, 246, 0.5);
        transition: all 0.15s ease;
      }

      .btn-roll:hover:not(:disabled) {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(139, 92, 246, 0.8);
      }

      .btn-roll:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .btn-toggle {
        background: rgba(255,255,255,0.08);
        border: 1px solid var(--panel-border);
        color: var(--text);
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 800;
        font-size: 0.85rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-toggle.active {
        background: rgba(34, 197, 94, 0.25);
        border-color: var(--accent);
        color: var(--accent);
      }

      .btn-toggle.auto-active {
        background: rgba(168, 85, 247, 0.3);
        border-color: var(--primary-glow);
        color: var(--primary-glow);
        box-shadow: 0 0 12px rgba(168, 85, 247, 0.4);
      }

      .pity-container {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 120px;
      }

      .pity-label {
        font-size: 0.75rem;
        font-weight: 800;
        color: var(--muted);
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
      }

      .pity-bar-bg {
        width: 100%;
        height: 10px;
        background: rgba(255,255,255,0.1);
        border-radius: 6px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
      }

      .pity-bar-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b82f6, #ec4899);
        transition: width 0.3s ease;
      }

      .pity-bar-fill.ready {
        background: linear-gradient(90deg, #22c55e, #eab308);
        box-shadow: 0 0 10px #22c55e;
      }

      .modal-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(4, 7, 15, 0.85);
        backdrop-filter: blur(10px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .modal-backdrop.active { opacity: 1; pointer-events: auto; }

      .modal-window {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: 24px;
        width: min(92vw, 720px);
        max-height: 82vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8);
        transform: scale(0.9);
        transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: hidden;
      }

      .modal-backdrop.active .modal-window { transform: scale(1); }

      .modal-header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--panel-border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: rgba(255,255,255,0.02);
      }

      .modal-header h2 {
        margin: 0;
        font-size: 1.25rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .modal-close {
        background: transparent;
        border: none;
        color: var(--muted);
        font-size: 1.5rem;
        cursor: pointer;
        padding: 0 8px;
      }

      .modal-body {
        padding: 20px 24px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .grid-3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
      
      .card-item {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--panel-border);
        border-radius: 14px;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 8px;
      }

      .aura-tag {
        font-size: 0.75rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      .btn-sm {
        border: none;
        padding: 6px 12px;
        border-radius: 8px;
        font-weight: 700;
        font-size: 0.8rem;
        cursor: pointer;
        background: var(--primary);
        color: #fff;
      }

      .btn-sm.secondary { background: rgba(255,255,255,0.1); color: var(--text); }
      .btn-sm.cheat { background: #dc2626; color: #fff; }
      .btn-sm.cheat:hover { background: #ef4444; }

      .cs-overlay {
        position: fixed;
        inset: 0;
        background: rgba(3, 7, 18, 0.92);
        backdrop-filter: blur(14px);
        z-index: 400;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .cs-overlay.active { opacity: 1; pointer-events: auto; }

      .cs-overlay.quick-mode {
        inset: auto;
        top: 75px;
        left: 50%;
        transform: translateX(-50%);
        width: min(90vw, 520px);
        height: 120px;
        border-radius: 20px;
        border: 2px solid var(--primary-glow);
        box-shadow: 0 12px 40px rgba(0,0,0,0.8);
        background: rgba(10, 16, 30, 0.96);
        backdrop-filter: blur(10px);
        opacity: 0;
        pointer-events: none;
      }

      .cs-overlay.quick-mode.active { opacity: 1; pointer-events: auto; }
      .cs-overlay.quick-mode .cs-title-text { display: none; }

      .cs-viewport {
        position: relative;
        width: min(90vw, 650px);
        height: 130px;
        background: #080d1a;
        border: 2px solid var(--panel-border);
        border-radius: 16px;
        overflow: hidden;
        box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
      }

      .cs-overlay.quick-mode .cs-viewport {
        width: 100%;
        height: 100%;
        border: none;
        border-radius: 18px;
      }

      .cs-reel {
        display: flex;
        position: absolute;
        top: 12px;
        left: 0;
        gap: 10px;
        will-change: transform;
      }

      .cs-tile {
        width: 110px;
        height: 104px;
        background: rgba(255,255,255,0.04);
        border-radius: 12px;
        border-bottom: 5px solid #94a3b8;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 6px;
        text-align: center;
        flex-shrink: 0;
      }

      .cs-tile-name {
        font-size: 0.78rem;
        font-weight: 800;
        margin-top: 4px;
        text-transform: uppercase;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        width: 100%;
      }

      .cs-pointer {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 50%;
        width: 4px;
        background: #ef4444;
        transform: translateX(-50%);
        z-index: 10;
        box-shadow: 0 0 12px #ef4444;
      }

      .cs-pointer::before, .cs-pointer::after {
        content: '';
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        width: 0; height: 0;
        border-left: 8px solid transparent;
        border-right: 8px solid transparent;
      }

      .cs-pointer::before { top: 0; border-top: 10px solid #ef4444; }
      .cs-pointer::after { bottom: 0; border-bottom: 10px solid #ef4444; }

      .cutscene-overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at center, rgba(15,23,42,0.92), rgba(2,4,10,0.98));
        backdrop-filter: blur(20px);
        z-index: 500;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.4s ease;
      }

      .cutscene-overlay.active { opacity: 1; pointer-events: auto; }
      .cutscene-card { text-align: center; transform: scale(0.7); transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
      .cutscene-overlay.active .cutscene-card { transform: scale(1); }

      #miniMap {
        position: fixed;
        bottom: 24px;
        right: 24px;
        width: 120px;
        height: 120px;
        border-radius: 50%;
        border: 2px solid var(--panel-border);
        background: rgba(15, 23, 42, 0.85);
        z-index: 10;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="gameCanvas"></canvas>
    <canvas id="miniMap" width="120" height="120"></canvas>

    <!-- Top HUD Navigation -->
    <div class="hud-topbar">
      <div class="hud-group">
        <div class="hud-badge">🪙 Coins: <span id="coinVal">0</span></div>
        <div class="hud-badge">✨ Luck Multiplier: <span id="luckVal">+0% (1.0x)</span></div>
        <div class="hud-badge">⚙️ Gear: <span id="gearVal">Basic Wristband</span></div>
        <div class="hud-badge">🔮 Aura: <span id="equippedVal">None</span></div>
      </div>
      <div class="hud-group">
        <button class="hud-btn" id="btnOpenLocker">🎒 Bag [E]</button>
        <button class="hud-btn" id="btnOpenShop">🛠️ Gear Workshop [M]</button>
        <button class="hud-btn" id="btnOpenQuests">📜 Quests</button>
        <button class="hud-btn" id="btnOpenCodex">📖 Index</button>
        <button class="hud-btn" id="btnOpenStats">📊 Stats</button>
        <button class="hud-btn" id="btnOpenSettings">⚙️ Settings</button>
      </div>
    </div>

    <!-- Bottom Roll Controls Bar -->
    <div class="hud-roll-bar">
      <button class="btn-roll" id="rollBtn">ROLL AURA [Space]</button>
      <button class="btn-toggle" id="autoToggleBtn">🔄 AUTO: OFF</button>
      <button class="btn-toggle" id="quickToggleBtn">⚡ QUICK: OFF</button>
      <div class="pity-container">
        <div class="pity-label">
          <span>2x Luck Pity</span>
          <span id="pityText">0/10</span>
        </div>
        <div class="pity-bar-bg">
          <div class="pity-bar-fill" id="pityFill"></div>
        </div>
      </div>
    </div>

    <!-- Modal Overlay -->
    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal-window">
        <div class="modal-header">
          <h2 id="modalTitle">Menu</h2>
          <button class="modal-close" id="modalCloseBtn">&times;</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>

    <!-- CS-Style Case Opening Reel Overlay -->
    <div class="cs-overlay" id="csOverlay">
      <div class="cs-title-text" style="color:var(--muted); font-size:0.85rem; font-weight:800; letter-spacing:0.2em; margin-bottom:14px;">ROLLING DIMENSIONAL REEL...</div>
      <div class="cs-viewport" id="csViewport">
        <div class="cs-pointer"></div>
        <div class="cs-reel" id="csReel"></div>
      </div>
    </div>

    <!-- Cutscene Overlay -->
    <div class="cutscene-overlay" id="cutsceneOverlay">
      <div class="cutscene-card">
        <div style="color:var(--muted); letter-spacing:0.3em; margin-bottom:12px; font-weight:800;">⚡ RARE AURA DISCOVERED ⚡</div>
        <div id="csOdds" style="font-size:1.6rem; color:#e2e8f0; margin-bottom:8px; font-weight:900;">1 in 10,000</div>
        <div id="csReward" style="font-size:1.1rem; color:var(--gold); margin-bottom:12px; font-weight:800;">+0 Coins Earned</div>
        <h1 id="csTitle" style="font-size:3.5rem; margin:10px 0; font-weight:900;">AURA NAME</h1>
        <div id="csRarity" class="aura-tag" style="font-size:1.5rem; margin-bottom:28px;">RARITY</div>
        <button class="btn-roll" id="csCloseBtn" style="padding:12px 36px;">COLLECT</button>
      </div>
    </div>

    <script>
      // -------------------------------------------------------------
      // AUDIO SYSTEM
      // -------------------------------------------------------------
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      function playSfx(type) {
        if (!settings.sfxEnabled) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'tick') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(600, now);
          gain.gain.setValueAtTime(0.03, now); gain.gain.linearRampToValueAtTime(0.001, now + 0.03);
          osc.start(now); osc.stop(now + 0.03);
        } else if (type === 'potion') {
          osc.frequency.setValueAtTime(500, now); osc.frequency.exponentialRampToValueAtTime(1200, now + 0.2);
          gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (type === 'rare') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(200, now); osc.frequency.exponentialRampToValueAtTime(1600, now + 1.0);
          gain.gain.setValueAtTime(0.2, now); gain.gain.linearRampToValueAtTime(0.01, now + 1.0);
          osc.start(now); osc.stop(now + 1.0);
        }
      }

      // -------------------------------------------------------------
      // ENGINE & CONFIG
      // -------------------------------------------------------------
      const canvas = document.getElementById('gameCanvas');
      const ctx = canvas.getContext('2d');
      const miniCanvas = document.getElementById('miniMap');
      const miniCtx = miniCanvas.getContext('2d');

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const rarityColors = {
        Common: '#94a3b8', Uncommon: '#4ade80', Rare: '#60a5fa', Epic: '#c084fc',
        Legendary: '#fbbf24', Mythic: '#f43f5e', Divine: '#38bdf8', Celestial: '#a855f7',
        Singularity: '#ec4899', Omnipotent: '#06b6d4', Genesis: '#f97316'
      };

      const defaultSettings = { sfxEnabled: true, cutscenesEnabled: true, autoEquipEnabled: true };

      const defaultState = {
        coins: 10, gearIndex: 0, inventory: [], equippedAura: null,
        totalRolls: 0, rollPity: 0, unlockedCodex: [], playerSkin: 'Default',
        quickRoll: false, autoRoll: false, skinList: ['Default'], player: { x: 1000, y: 1000, radius: 20, speed: 280 }
      };

      let settings = loadSettings();
      let state = loadSaveData();
      let isRolling = false;
      let autoRollTimer = null;
      let worldPotions = [];
      let auraParticles = [];

      const world = { width: 2400, height: 2400 };
      const keys = {};

      // EXPANDED GEARED LUCK SYSTEM (SOL'S RNG STYLE GEARS)
      const gearCatalog = [
        { id: 0, name: 'Basic Wristband', cost: 0, luckBonus: 0, desc: 'A simple fabric strap. Base 1.0x Luck.' },
        { id: 1, name: 'Luck Ring', cost: 25, luckBonus: 25, desc: 'Infused with minor clover magic (+25% Luck = 1.25x multiplier).' },
        { id: 2, name: 'Emerald Glove', cost: 75, luckBonus: 75, desc: 'Encrusted with focus crystal shards (+75% Luck = 1.75x multiplier).' },
        { id: 3, name: 'Gilded Gauntlet', cost: 200, luckBonus: 150, desc: 'Forged from solid gold leaf (+150% Luck = 2.5x multiplier).' },
        { id: 4, name: 'Subzero Device', cost: 500, luckBonus: 350, desc: 'Chills surrounding probability fields (+350% Luck = 4.5x multiplier).' },
        { id: 5, name: 'Exo-Flex Glove', cost: 1200, luckBonus: 800, desc: 'Cybernetic enhancement for high rolls (+800% Luck = 9x multiplier).' },
        { id: 6, name: 'Gravitational Glove', cost: 3000, luckBonus: 2000, desc: 'Distorts reality to pull in rarer items (+2,000% Luck = 21x multiplier).' },
        { id: 7, name: 'Galactic Device', cost: 8000, luckBonus: 5000, desc: 'Harnesses orbital alignment energy (+5,000% Luck = 51x multiplier).' },
        { id: 8, name: 'Heavenly Device', cost: 25000, luckBonus: 12000, desc: 'Blessed by high celestial entities (+12,000% Luck = 121x multiplier).' }
      ];

      function buildCatalog() {
        const prefixes = [
          'Starlight', 'Void', 'Cyber', 'Arcane', 'Abyssal', 'Celestial', 'Eternal', 'Astral',
          'Phantom', 'Divine', 'Solar', 'Lunar', 'Nebula', 'Zenith', 'Sovereign', 'Hyper',
          'Obsidian', 'Tempest', 'Infinite', 'Quantum', 'Eldritch', 'Galactic', 'Omega', 'Apex',
          'Chroma', 'Nether', 'Cosmic', 'Primordial', 'Seraphic', 'Valhalla', 'Aetherial', 'Radiant',
          'Infernal', 'Twilight', 'Chronos', 'Genesis', 'Spectra', 'Valkyrie', 'Oblivion', 'Aurora'
        ];

        const suffixes = [
          'Glow', 'Spark', 'Ember', 'Storm', 'Pulse', 'Core', 'Crest', 'Prism', 'Aegis',
          'Crown', 'Fracture', 'Horizon', 'Eclipse', 'Helix', 'Beacon', 'Catalyst', 'Requiem',
          'Dominion', 'Overlord', 'Singularity', 'Mirage', 'Radiance', 'Vortex', 'Symphony',
          'Ascension', 'Monarch', 'Paradox', 'Nova', 'Flux', 'Sentinel', 'Sanctuary', 'Nexus'
        ];

        const catalog = [];
        const total = 250;

        let nameIndex = 0;
        const usedNames = new Set();

        for (let i = 0; i < total; i++) {
          const odds = Math.round(Math.exp(Math.log(2) + (i / (total - 1)) * (Math.log(500000000) - Math.log(2))));
          let rarity = 'Common';
          if (odds > 100000000) rarity = 'Genesis';
          else if (odds > 25000000) rarity = 'Omnipotent';
          else if (odds > 5000000) rarity = 'Singularity';
          else if (odds > 1000000) rarity = 'Celestial';
          else if (odds > 250000) rarity = 'Divine';
          else if (odds > 50000) rarity = 'Mythic';
          else if (odds > 10000) rarity = 'Legendary';
          else if (odds > 1500) rarity = 'Epic';
          else if (odds > 200) rarity = 'Rare';
          else if (odds > 20) rarity = 'Uncommon';

          let uniqueName = "";
          while (!uniqueName || usedNames.has(uniqueName)) {
            const p = prefixes[nameIndex % prefixes.length];
            const s = suffixes[Math.floor(nameIndex / prefixes.length) % suffixes.length];
            uniqueName = `${p} ${s}`;
            nameIndex++;
          }
          usedNames.add(uniqueName);

          catalog.push({
            id: i,
            name: uniqueName,
            odds, rarity,
            primaryColor: rarityColors[rarity]
          });
        }
        return catalog;
      }

      const auraCatalog = buildCatalog();

      const playerSkins = [
        { id: 'Default', name: 'Standard Sphere', cost: 0, color: '#f8fafc' },
        { id: 'Emerald', name: 'Emerald Gem', cost: 50, color: '#10b981' },
        { id: 'Ruby', name: 'Crimson Core', cost: 100, color: '#ef4444' },
        { id: 'VoidOrb', name: 'Void Core', cost: 300, color: '#a855f7' }
      ];

      const quests = [
        { id: 'q1', text: 'Roll 10 Auras', target: 10, key: 'totalRolls', reward: 15, claimed: false },
        { id: 'q2', text: 'Roll 50 Auras', target: 50, key: 'totalRolls', reward: 50, claimed: false },
        { id: 'q3', text: 'Roll 200 Auras', target: 200, key: 'totalRolls', reward: 150, claimed: false }
      ];

      // -------------------------------------------------------------
      // SAVE DATA MANAGEMENT
      // -------------------------------------------------------------
      function saveGame() { localStorage.setItem('mm_rng_sols_v3', JSON.stringify(state)); }
      function loadSaveData() {
        try { const r = localStorage.getItem('mm_rng_sols_v3'); return r ? { ...defaultState, ...JSON.parse(r) } : { ...defaultState }; }
        catch(e) { return { ...defaultState }; }
      }
      function saveSettings() { localStorage.setItem('mm_rng_settings_v3', JSON.stringify(settings)); }
      function loadSettings() {
        try { const r = localStorage.getItem('mm_rng_settings_v3'); return r ? { ...defaultSettings, ...JSON.parse(r) } : { ...defaultSettings }; }
        catch(e) { return { ...defaultSettings }; }
      }

      // -------------------------------------------------------------
      // GAME MECHANICS & REAL LUCK STAT SYSTEM
      // -------------------------------------------------------------
      function getLuckBonus(isPityRoll = false) {
        const gear = gearCatalog[state.gearIndex] || gearCatalog[0];
        let base = gear.luckBonus;
        let multiplier = isPityRoll ? 2 : 1;
        return base * multiplier;
      }

      function spawnPotions() {
        while (worldPotions.length < 15) {
          worldPotions.push({
            x: Math.random() * (world.width - 200) + 100,
            y: Math.random() * (world.height - 200) + 100,
            radius: 10,
            coinVal: Math.floor(Math.random() * 5) + 5
          });
        }
      }

      function equipBestOwned() {
        if (!state.inventory.length) state.equippedAura = null;
        else state.equippedAura = [...state.inventory].sort((a,b) => b.odds - a.odds)[0];
        saveGame(); updateHUD();
      }

      function triggerCutscene(aura, coinReward) {
        document.getElementById('csTitle').textContent = aura.name;
        document.getElementById('csTitle').style.color = aura.primaryColor;
        document.getElementById('csRarity').textContent = aura.rarity;
        document.getElementById('csRarity').style.color = aura.primaryColor;
        document.getElementById('csOdds').textContent = `1 in ${aura.odds.toLocaleString()}`;
        document.getElementById('csReward').textContent = `+${coinReward.toLocaleString()} Coins Earned!`;
        document.getElementById('cutsceneOverlay').classList.add('active');
        playSfx('rare');
      }

      // TRUE SOL'S RNG PROBABILITY ENGINE WITH WORKING LUCK
      function sampleLuckWeightedAura(luckMult) {
        // Evaluates candidates ordered from RAREST (highest odds) down to COMMONEST
        const sorted = [...auraCatalog].sort((a, b) => b.odds - a.odds);
        for (const aura of sorted) {
          // Effective chance formula: 1 in (odds / luckMultiplier)
          const chance = Math.min(1.0, luckMult / aura.odds);
          if (Math.random() < chance) return aura;
        }
        return sorted[sorted.length - 1]; // Common fallback
      }

      function rollAura() {
        if (isRolling) return;
        isRolling = true;
        document.getElementById('rollBtn').disabled = true;

        const isPity = state.rollPity >= 9;
        const luckBonus = getLuckBonus(isPity);
        const luckMultiplier = 1 + (luckBonus / 100);

        const won = sampleLuckWeightedAura(luckMultiplier);

        const reelList = [];
        const winIndex = 36;
        for (let i = 0; i < 45; i++) {
          if (i === winIndex) reelList.push(won);
          else reelList.push(sampleLuckWeightedAura(luckMultiplier));
        }

        const csOverlay = document.getElementById('csOverlay');
        const csReel = document.getElementById('csReel');
        const csViewport = document.getElementById('csViewport');

        if (state.quickRoll) csOverlay.classList.add('quick-mode');
        else csOverlay.classList.remove('quick-mode');

        csReel.innerHTML = reelList.map(a => `
          <div class="cs-tile" style="border-bottom-color: ${a.primaryColor}">
            <div style="font-weight:900; color:${a.primaryColor}; font-size:1.1rem;">✦</div>
            <div class="cs-tile-name" style="color:${a.primaryColor}">${a.name}</div>
            <div style="font-size:0.65rem; color:var(--muted); font-weight:800; margin-top:2px;">1 in ${a.odds.toLocaleString()}</div>
          </div>
        `).join('');

        csReel.style.transition = 'none';
        csReel.style.transform = 'translateX(0px)';

        csOverlay.classList.add('active');

        const tileWidth = 120;
        const viewportWidth = csViewport.clientWidth;
        const offsetInsideTile = Math.random() * 70 + 15;
        const targetScroll = (winIndex * tileWidth) - (viewportWidth / 2) + (110 / 2) + (offsetInsideTile - 35);

        setTimeout(() => {
          const duration = state.quickRoll ? 0.9 : 2.5;
          csReel.style.transition = `transform ${duration}s cubic-bezier(0.12, 0.8, 0.2, 1.0)`;
          csReel.style.transform = `translateX(-${targetScroll}px)`;

          let lastTickIndex = -1;
          const startTime = performance.now();

          function tickCheck(now) {
            const elapsed = (now - startTime) / 1000;
            const progress = Math.min(1, elapsed / duration);
            const easedProgress = 1 - Math.pow(1 - progress, 3);
            const currentScroll = targetScroll * easedProgress;

            const passedTile = Math.floor(currentScroll / tileWidth);
            if (passedTile !== lastTickIndex && passedTile < winIndex) {
              lastTickIndex = passedTile;
              playSfx('tick');
            }

            if (progress < 1) requestAnimationFrame(tickCheck);
          }
          requestAnimationFrame(tickCheck);

          setTimeout(() => {
            setTimeout(() => {
              csOverlay.classList.remove('active');
              finishRoll(won, isPity);
            }, state.quickRoll ? 150 : 400);
          }, duration * 1000);
        }, 50);
      }

      function finishRoll(won, wasPity) {
        state.totalRolls++;
        if (wasPity) state.rollPity = 0;
        else state.rollPity++;

        // Coin reward scales exponentially with aura rarity
        const coinReward = Math.max(1, Math.floor(Math.pow(won.odds, 0.40) * 2.2));
        state.coins += coinReward;

        if (!state.unlockedCodex.includes(won.id)) state.unlockedCodex.push(won.id);

        const exists = state.inventory.some(i => i.id === won.id);
        if (!exists) {
          state.inventory.push({ ...won });
          if (settings.autoEquipEnabled) equipBestOwned();
        }

        isRolling = false;
        document.getElementById('rollBtn').disabled = false;

        if (won.odds >= 1000 && settings.cutscenesEnabled) triggerCutscene(won, coinReward);

        updateHUD(); saveGame();

        if (state.autoRoll) {
          clearTimeout(autoRollTimer);
          autoRollTimer = setTimeout(() => {
            if (state.autoRoll && !isRolling && !document.getElementById('cutsceneOverlay').classList.contains('active')) {
              rollAura();
            }
          }, state.quickRoll ? 200 : 600);
        }
      }

      // -------------------------------------------------------------
      // THEMATIC & UNIQUE AURA ANIMATIONS ENGINE
      // -------------------------------------------------------------
      function updateAndDrawAura(dt, screenX, screenY, aura) {
        if (!aura) return;

        const now = Date.now() / 1000;
        const color = aura.primaryColor || '#94a3b8';
        const id = aura.id;
        const name = aura.name.toLowerCase();

        // Categorize theme based on aura keywords
        let theme = 'cosmic';
        if (name.includes('void') || name.includes('abyssal') || name.includes('obsidian') || name.includes('oblivion') || name.includes('nether') || name.includes('eclipse')) {
          theme = 'void';
        } else if (name.includes('solar') || name.includes('ember') || name.includes('infernal') || name.includes('flame') || name.includes('storm') || name.includes('flare') || name.includes('radiant')) {
          theme = 'fire';
        } else if (name.includes('cyber') || name.includes('quantum') || name.includes('chroma') || name.includes('spectra') || name.includes('flux') || name.includes('hyper')) {
          theme = 'cyber';
        } else if (name.includes('tempest') || name.includes('fracture') || name.includes('vortex') || name.includes('lightning')) {
          theme = 'lightning';
        } else if (name.includes('chronos') || name.includes('clock') || name.includes('infinite') || name.includes('paradox')) {
          theme = 'time';
        } else if (name.includes('divine') || name.includes('seraph') || name.includes('sovereign') || name.includes('apex') || name.includes('monarch') || name.includes('valhalla')) {
          theme = 'divine';
        }

        ctx.save();
        ctx.translate(screenX, screenY);

        const baseRadius = 28 + (id % 12);
        const pulse = Math.sin(now * 3 + id) * 4;
        const rotSpeed = 0.5 + (id % 5) * 0.3;
        const dir = (id % 2 === 0) ? 1 : -1;

        if (theme === 'void') {
          // Gravitational Singularities & Black Hole Event Horizon
          ctx.fillStyle = 'rgba(12, 3, 28, 0.6)';
          ctx.beginPath();
          ctx.arc(0, 0, baseRadius + 16 + pulse, 0, Math.PI * 2);
          ctx.fill();

          ctx.strokeStyle = color;
          ctx.lineWidth = 3.5;
          ctx.shadowColor = color;
          ctx.shadowBlur = 18;
          ctx.beginPath();
          ctx.arc(0, 0, baseRadius + pulse, now * 2 * dir, now * 2 * dir + Math.PI * 1.5);
          ctx.stroke();

          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(0, 0, baseRadius * 0.65, -now * 3 * dir, -now * 3 * dir + Math.PI * 1.2);
          ctx.stroke();

        } else if (theme === 'fire') {
          // Solar Flares & Fiery Dynamic Corona
          ctx.shadowColor = color;
          ctx.shadowBlur = 22;
          const numRays = 8 + (id % 6);
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;
          for (let i = 0; i < numRays; i++) {
            const angle = (i / numRays) * Math.PI * 2 + now * rotSpeed * dir;
            const rayLen = baseRadius + 12 + Math.sin(now * 8 + i) * 8;
            ctx.beginPath();
            ctx.moveTo(Math.cos(angle) * (baseRadius - 4), Math.sin(angle) * (baseRadius - 4));
            ctx.lineTo(Math.cos(angle) * rayLen, Math.sin(angle) * rayLen);
            ctx.stroke();
          }

          ctx.beginPath();
          ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
          ctx.stroke();

        } else if (theme === 'cyber') {
          // Rotating Polygon Matrix & Digital Reticles
          ctx.shadowColor = color;
          ctx.shadowBlur = 14;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;

          const sides = 3 + (id % 5);
          ctx.rotate(now * rotSpeed * dir);
          ctx.beginPath();
          for (let i = 0; i < sides; i++) {
            const angle = (i / sides) * Math.PI * 2;
            const x = Math.cos(angle) * (baseRadius + 12);
            const y = Math.sin(angle) * (baseRadius + 12);
            if (i === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.stroke();

          ctx.rotate(-now * rotSpeed * 2 * dir);
          ctx.strokeRect(-baseRadius/1.8, -baseRadius/1.8, baseRadius*1.1, baseRadius*1.1);

        } else if (theme === 'lightning') {
          // Arcing Lightning Crackles
          ctx.shadowColor = color;
          ctx.shadowBlur = 20;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;

          const arcs = 5 + (id % 4);
          for (let i = 0; i < arcs; i++) {
            const a1 = (i / arcs) * Math.PI * 2 + now * 3;
            const a2 = a1 + (Math.PI / arcs) * 0.8;
            ctx.beginPath();
            ctx.arc(0, 0, baseRadius + (Math.random() * 8), a1, a2);
            ctx.stroke();
          }

        } else if (theme === 'time') {
          // Clockwork Gear Teeth & Ticking Chrono Dial
          ctx.shadowColor = color;
          ctx.shadowBlur = 16;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2;

          ctx.beginPath();
          ctx.arc(0, 0, baseRadius + 10, 0, Math.PI * 2);
          ctx.stroke();

          const teeth = 12;
          for (let i = 0; i < teeth; i++) {
            const angle = (i / teeth) * Math.PI * 2 + now * rotSpeed;
            const x1 = Math.cos(angle) * (baseRadius + 10);
            const y1 = Math.sin(angle) * (baseRadius + 10);
            const x2 = Math.cos(angle) * (baseRadius + 16);
            const y2 = Math.sin(angle) * (baseRadius + 16);
            ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
          }

          const handAngle = now * 4;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(handAngle) * (baseRadius + 8), Math.sin(handAngle) * (baseRadius + 8));
          ctx.stroke();

        } else if (theme === 'divine') {
          // Celestial Halo Floating Above Player
          ctx.shadowColor = '#fde047';
          ctx.shadowBlur = 25;
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;

          ctx.beginPath();
          ctx.ellipse(0, -32, 22, 7, 0, 0, Math.PI * 2);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, baseRadius + pulse, 0, Math.PI * 2);
          ctx.stroke();

        } else {
          // Cosmic Constellation Rings
          ctx.shadowColor = color;
          ctx.shadowBlur = 18;
          ctx.strokeStyle = color;
          ctx.lineWidth = 2.5;

          ctx.beginPath();
          ctx.arc(0, 0, baseRadius + pulse, now * rotSpeed, now * rotSpeed + Math.PI * 1.3);
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(0, 0, baseRadius * 1.35 + pulse, -now * rotSpeed * 0.7, -now * rotSpeed * 0.7 + Math.PI * 1.1);
          ctx.stroke();
        }

        ctx.restore();

        // Particle Emitter
        if (Math.random() < 0.6) {
          const angle = Math.random() * Math.PI * 2;
          const dist = Math.random() * (baseRadius + 10);
          auraParticles.push({
            x: screenX + Math.cos(angle) * dist,
            y: screenY + Math.sin(angle) * dist,
            vx: (Math.random() - 0.5) * 35,
            vy: (Math.random() - 0.5) * 35 - (theme === 'fire' ? 25 : 0),
            size: Math.random() * 3.5 + 1.5,
            color: color,
            life: 1.0,
            decay: Math.random() * 0.8 + 0.6
          });
        }

        // Particle System Animation Render
        for (let i = auraParticles.length - 1; i >= 0; i--) {
          const p = auraParticles[i];
          p.life -= p.decay * dt;
          if (p.life <= 0) {
            auraParticles.splice(i, 1);
            continue;
          }

          p.x += p.vx * dt;
          p.y += p.vy * dt;

          ctx.save();
          ctx.globalAlpha = p.life;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color;
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }
      }

      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');

          </div>

              const isEquipped = state.equippedAura && state.equippedAura.id === aura.id;

          </div>

          <h3 style="margin-top:0;">Sol's Luck Gears</h3>
          <div style="display:flex; flex-direction:column; gap:10px;">
            ${gearCatalog.map((g, idx) => {
              const isOwned = idx <= state.gearIndex;
              const isCurrent = idx === state.gearIndex;
              const canBuy = state.coins >= g.cost && idx === state.gearIndex + 1;
              const multiplier = (1 + g.luckBonus / 100).toFixed(2);
              return `
                <div class="card-item" style="flex-direction:row; align-items:center; justify-content:space-between; border-left:4px solid ${isCurrent?'var(--accent)':'var(--panel-border)'}">

                    <strong style="font-size:1rem; color:${isCurrent?'var(--accent)':'#fff'}">${g.name}</strong>
                    <div style="color:var(--primary-glow); font-size:0.85rem; font-weight:700;">+${g.luckBonus}\% Luck (${multiplier}x Multiplier)</div>
                    <div style="color:var(--muted); font-size:0.75rem;">${g.desc}</div>
                  </div>
                  <button class="btn-sm ${isCurrent?'secondary':''}" ${(!canBuy && !isCurrent) ? 'disabled' : ''} onclick="buyGear(${idx},${g.cost})">

                  </button>
                </div>
              `;
            }).join('')}
          </div>

          <h3 style="margin-top:20px;">Skins</h3>
          <div class="grid-3">
            ${playerSkins.map(s => {
              const isUnlocked = state.skinList.includes(s.id);
              const isEquipped = state.playerSkin === s.id;
              return `
                <div class="card-item">
                  <strong style="color:${s.color}">${s.name}</strong>
                  <button class="btn-sm ${isEquipped?'secondary':''}" onclick="buyOrEquipSkin('${s.id}',${s.cost})">
                    ${isEquipped ? 'Active' : isUnlocked ? 'Equip' : `Buy ${s.cost} C`}
                  </button>
                </div>
              `;
            }).join('')}
          </div>
        `;
        openModal('Gear Workshop & Upgrades', html);
      }

      function showQuestsModal() {
        const html = quests.map(q => {
          const current = Math.min(q.target, state[q.key] || 0);
          const done = current >= q.target;
          return `
            <div class="card-item">
              <div>
                <strong>${q.text}</strong>
                <div style="color:var(--muted); font-size:0.8rem;">Progress: ${current} / ${q.target}</div>
              </div>
              <button class="btn-sm" ${!done || q.claimed ? 'disabled' : ''} onclick="claimQuest('${q.id}')">
                ${q.claimed ? 'Claimed' : done ? 'Claim' : `+${q.reward} C`}
              </button>
            </div>
          `;
        }).join('');
        openModal('Milestones', html);
      }

      function showCodexModal() {
        const html = `
          <p style="color:var(--muted); font-size:0.85rem;">Discovered ${state.unlockedCodex.length} / ${auraCatalog.length} Unique Auras</p>
          <div class="grid-3">
            ${auraCatalog.map(a => {
              const discovered = state.unlockedCodex.includes(a.id);
              return `
                <div class="card-item" style="opacity:${discovered ? 1 : 0.4}">
                  <strong>${discovered ? a.name : '??? Hidden'}</strong>
                  <div class="aura-tag" style="color:${a.primaryColor}">${a.rarity}</div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        openModal('Aura Codex Index', html);

      function showStatsModal() {
        const luckBonus = getLuckBonus(state.rollPity >= 9);
        const luckMult = (1 + luckBonus / 100).toFixed(2);
        const html = `
          <div class="card-item"><strong>Total Rolls:</strong> ${state.totalRolls}</div>
          <div class="card-item"><strong>Unique Auras Discovered:</strong> ${state.inventory.length} / ${auraCatalog.length}</div>
          <div class="card-item"><strong>Current Luck Boost:</strong> +${luckBonus}% (${luckMult}x Odds Multiplier)</div>
        `;
        openModal('Player Stats', html);
      }

      function showSettingsModal() {
        const html = `
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0;">
            <label>Sound Effects</label>
            <input type="checkbox" ${settings.sfxEnabled?'checked':''} onchange="settings.sfxEnabled=this.checked; saveSettings();">
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0;">

          <hr style="border:0; border-top:1px solid var(--panel-border); margin:16px 0 12px 0;">

      // Cheat Menu Functions
      window.cheatAddCoins = function(amount) {
        state.coins += amount;
        updateHUD(); saveGame(); showSettingsModal();
      };

      window.cheatUnlockAll = function() {
        auraCatalog.forEach(a => {
          if (!state.unlockedCodex.includes(a.id)) state.unlockedCodex.push(a.id);
          if (!state.inventory.some(i => i.id === a.id)) state.inventory.push({ ...a });
        });
        equipBestOwned();
        updateHUD(); saveGame(); showSettingsModal();
      };

      window.cheatFillPity = function() {
        state.rollPity = 9;
        updateHUD(); saveGame(); showSettingsModal();
      };

      window.cheatResetData = function() {
        localStorage.removeItem('mm_rng_sols_v3');
        state = { ...defaultState, inventory: [], unlockedCodex: [], skinList: ['Default'] };
        updateHUD(); saveGame(); showSettingsModal();
      };

      window.equipAuraById = function(id) {
        state.equippedAura = state.inventory.find(i => i.id === id);
        updateHUD(); saveGame(); showLockerModal();
      };

      window.buyGear = function(idx, cost) {
        if (state.coins >= cost && idx === state.gearIndex + 1) {
          state.coins -= cost; state.gearIndex = idx;
          updateHUD(); saveGame(); showShopModal();
        }
      };

      window.buyOrEquipSkin = function(id, cost) {
        if (state.skinList.includes(id)) {
          state.playerSkin = id;
        } else if (state.coins >= cost) {
          state.coins -= cost; state.skinList.push(id); state.playerSkin = id;
        }
        updateHUD(); saveGame(); showShopModal();
      };

      window.claimQuest = function(id) {
        const q = quests.find(x => x.id === id);
        if (q && !q.claimed) {
          q.claimed = true; state.coins += q.reward;
          updateHUD(); saveGame(); showQuestsModal();
        }
      };

      function toggleQuickRoll() {
        state.quickRoll = !state.quickRoll;
        updateHUD(); saveGame();
      }

      function toggleAutoRoll() {
        state.autoRoll = !state.autoRoll;
        updateHUD(); saveGame();
        if (state.autoRoll && !isRolling) rollAura();
      }

      function updateHUD() {
        const luckBonus = getLuckBonus(state.rollPity >= 9);
        const luckMult = (1 + luckBonus / 100).toFixed(1);

        document.getElementById('coinVal').textContent = state.coins.toLocaleString();
        document.getElementById('luckVal').textContent = `+${luckBonus}% (${luckMult}x)`;
        document.getElementById('gearVal').textContent = gearCatalog[state.gearIndex] ? gearCatalog[state.gearIndex].name : 'None';
        document.getElementById('equippedVal').textContent = state.equippedAura ? state.equippedAura.name : 'None';

        const quickBtn = document.getElementById('quickToggleBtn');
        if (state.quickRoll) {
          quickBtn.textContent = '⚡ QUICK: ON';
          quickBtn.classList.add('active');
        } else {
          quickBtn.textContent = '⚡ QUICK: OFF';
          quickBtn.classList.remove('active');
        }

        const autoBtn = document.getElementById('autoToggleBtn');
        if (state.autoRoll) {
          autoBtn.textContent = '🔄 AUTO: ON';
          autoBtn.classList.add('auto-active');
        } else {
          autoBtn.textContent = '🔄 AUTO: OFF';
          autoBtn.classList.remove('auto-active');
        }

        const pityPercent = (state.rollPity / 9) * 100;
        const fill = document.getElementById('pityFill');
        fill.style.width = `${Math.min(100, pityPercent)}%`;
        
        if (state.rollPity >= 9) {
          fill.classList.add('ready');
          document.getElementById('pityText').textContent = '2X READY!';
        } else {
          fill.classList.remove('ready');
          document.getElementById('pityText').textContent = `${state.rollPity}/10`;
        }
      }

      // -------------------------------------------------------------
      // RENDERING & CANVAS LOOP
      // -------------------------------------------------------------
      function updateAndDrawPlayer(dt, camX, camY) {
        let dx = 0, dy = 0;
        if (keys['w'] || keys['arrowup']) dy -= 1;
        if (keys['s'] || keys['arrowdown']) dy += 1;
        if (keys['a'] || keys['arrowleft']) dx -= 1;
        if (keys['d'] || keys['arrowright']) dx += 1;

        if (dx !== 0 || dy !== 0) {
          const len = Math.hypot(dx, dy);
          state.player.x += (dx / len) * state.player.speed * dt;
          state.player.y += (dy / len) * state.player.speed * dt;
        }

        state.player.x = Math.max(20, Math.min(world.width - 20, state.player.x));
        state.player.y = Math.max(20, Math.min(world.height - 20, state.player.y));

        worldPotions = worldPotions.filter(p => {
          if (Math.hypot(state.player.x - p.x, state.player.y - p.y) < state.player.radius + p.radius) {
            state.coins += p.coinVal;
            playSfx('potion'); updateHUD(); saveGame(); return false;
          }
          return true;
        });
        spawnPotions();

        const screenX = state.player.x - camX;
        const screenY = state.player.y - camY;

        // Render equipped aura with thematic effects
        if (state.equippedAura) {
          updateAndDrawAura(dt, screenX, screenY, state.equippedAura);
        }

        const skinObj = playerSkins.find(s => s.id === state.playerSkin) || playerSkins[0];
        ctx.fillStyle = skinObj.color;
        ctx.beginPath(); ctx.arc(screenX, screenY, state.player.radius, 0, Math.PI * 2); ctx.fill();
        ctx.lineWidth = 3; ctx.strokeStyle = '#0f172a'; ctx.stroke();
      }

      function drawMiniMap() {
        miniCtx.clearRect(0, 0, 120, 120);
        const scale = 120 / world.width;
        
        miniCtx.fillStyle = '#c084fc';
        worldPotions.forEach(p => { miniCtx.fillRect(p.x * scale, p.y * scale, 3, 3); });

        miniCtx.fillStyle = '#22c55e';
        miniCtx.beginPath();
        miniCtx.arc(state.player.x * scale, state.player.y * scale, 4, 0, Math.PI * 2);
        miniCtx.fill();
      }

      function render(ts) {
        if (!render.last) render.last = ts;
        const dt = Math.min((ts - render.last) / 1000, 0.033);
        render.last = ts;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const camX = state.player.x - canvas.width / 2;
        const camY = state.player.y - canvas.height / 2;

        const tileSize = 80;
        const startX = Math.floor(camX / tileSize) * tileSize;
        const startY = Math.floor(camY / tileSize) * tileSize;

        for (let x = startX; x < camX + canvas.width + tileSize; x += tileSize) {
          for (let y = startY; y < camY + canvas.height + tileSize; y += tileSize) {
            ctx.fillStyle = ((x / tileSize) + (y / tileSize)) % 2 === 0 ? '#0b1120' : '#0f172a';
            ctx.fillRect(x - camX, y - camY, tileSize, tileSize);
          }
        }

        worldPotions.forEach(p => {
          ctx.fillStyle = '#c084fc';
          ctx.beginPath(); ctx.arc(p.x - camX, p.y - camY, p.radius, 0, Math.PI * 2); ctx.fill();
        });

        updateAndDrawPlayer(dt, camX, camY);
        drawMiniMap();

        requestAnimationFrame(render);
      }

      window.addEventListener('keydown', e => {
        const k = e.key.toLowerCase();
        keys[k] = true;

        if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(k)) return;

        if (e.code === 'Space') rollAura();
        if (k === 'e') showLockerModal();
        if (k === 'm') showShopModal();
        if (k === 'escape') closeModal();
      });

      window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

      document.getElementById('rollBtn').onclick = rollAura;
      document.getElementById('quickToggleBtn').onclick = toggleQuickRoll;
      document.getElementById('autoToggleBtn').onclick = toggleAutoRoll;
      document.getElementById('csCloseBtn').onclick = () => {
        document.getElementById('cutsceneOverlay').classList.remove('active');
        if (state.autoRoll && !isRolling) rollAura();
      };

      document.getElementById('btnOpenLocker').onclick = showLockerModal;
      document.getElementById('btnOpenShop').onclick = showShopModal;
      document.getElementById('btnOpenQuests').onclick = showQuestsModal;
      document.getElementById('btnOpenCodex').onclick = showCodexModal;
      document.getElementById('btnOpenStats').onclick = showStatsModal;
      document.getElementById('btnOpenSettings').onclick = showSettingsModal;

      spawnPotions();
      updateHUD();
      requestAnimationFrame(render);
    </script>
  </body>
</html>
